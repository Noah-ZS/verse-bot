name: post-verse

on:
  schedule:
    # Cron is in UTC. Example for UTC+4: 08:00 -> 04:00, 13:00 -> 09:00, 18:00 -> 14:00.
    # Delete lines if you want fewer than 3 posts/day.
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, no push/publish)"
        type: boolean
        default: false
      force:
        description: "Bypass min-gap / max-per-day guard"
        type: boolean
        default: false
      args:
        description: "Optional helper mode: --list-bibles, --check, --check-gemini or --check-instagram (leave empty for a normal run)"
        type: string
        default: ""

permissions:
  contents: write

# One run at a time so two triggers can never race on popular_verses.csv or double-post.
concurrency:
  group: post-verse
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "verse-bot"
          git config user.email "verse-bot@users.noreply.github.com"

      - name: Post verse
        run: python run.py ${{ inputs.args }}
        env:
          # ---- secrets (Settings > Secrets and variables > Actions) ----
          YVP_APP_KEY: ${{ secrets.YVP_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

          # ---- run mode (set by the "Run workflow" form; schedule runs use the defaults) ----
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}

          # ---- posting guard ----
          # Your offset from UTC in hours (e.g. 4 for UTC+4) so "max posts per day" follows your local day.
          POST_TZ_OFFSET_HOURS: "0"
          MAX_POSTS_PER_DAY: "3"
          MIN_GAP_MINUTES: "120"
          REPEAT_DAYS: "90"

          # ---- Bible / captions ----
          YV_BIBLE_IDS: "3034"
          CAPTION_LANG: "English"
          IG_HANDLE: ""

          # ---- Instagram (Meta Unified Login) ----
          IG_API_BASE: "https://graph.facebook.com"
          IG_API_VERSION: "v27.0"

      # Keeps dry-run images so you can look at them (nothing is published in a dry run).
      - name: Upload dry-run images
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dryrun-images
          path: images/dryrun-*.jpg
          if-no-files-found: ignore