name: post-verse

on:
  schedule:
    # Cron is in UTC. Example for UTC+4: 08:00 -> 04:00, 13:00 -> 09:00, 18:00 -> 14:00.
    # Delete lines if you want fewer than 3 posts/day.
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate only, no push/publish)"
        type: boolean
        default: false
      force:
        description: "Bypass min-gap / max-per-day guard"
        type: boolean
        default: false
      args:
        description: "Optional helper mode: --list-bibles  or  --check  (leave empty for a normal run)"
        type: string
        default: ""

permissions:
  contents: write

# One run at a time so two triggers can never race on verses.csv or double-post.
concurrency:
  group: post-verse
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "verse-bot"
          git config user.email "verse-bot@users.noreply.github.com"

      - name: Post verse
        run: python run.py --list-bibles
        env:
          YVP_APP_KEY: ${{ secrets.YVP_APP_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          # Set to your UTC offset so "max posts per day" uses your local day (e.g. 4 for UTC+4).
          POST_TZ_OFFSET_HOURS: "0"
          MAX_POSTS_PER_DAY: "3"
          MIN_GAP_MINUTES: "120"
          IG_HANDLE: ""
          # Bible ids to try in order (confirm with: python run.py --list-bibles)
          YV_BIBLE_IDS: "344"
          CAPTION_LANG: "Kreol Morisien (Mauritian Creole)"
          REPEAT_DAYS: "90"
